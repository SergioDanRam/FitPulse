services:
  postgres:
    image: postgres:16-alpine
    container_name: fit_pulse
    ports:
      - "5432:5432"
    restart:  always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres:/var/lib/postgresql/data

volumes:
  postgres:
